services:
  - type: web
    name: devsecassist-api
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      pip install -e .
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_KEY
        generateValue: true
